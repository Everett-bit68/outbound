<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outbound - Outdoor Activity Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Outbound</h1>
            <p> Your real time guide to what's happening outside.</p>
            <button id="themeToggle">🌙Dark mode</button>
            <form id="searchForm">
            <input type="text" id="cityInput" placeholder="Search city(e.g. London, Tokyo)..." required>
            <button type="submit" id="searchBtn">Search</button>
            </form>
        </header>
        <section class="weather-card" id="weatherCard">
            <div id="loading">Fetching local weather...</div>
            <div id="weather-info" class="hidden">
                <h2 id="locationName">Detecting location...</h2>
                <div class="temp-display">
                    <div class="temp-label">Temperature</div>
                    <span id="tempvalue">--</span>
                </div>
                <p id="condition-Text">--</p>
                <div class="score-badge" id="outsideScore">
                    Outside Score: <span>--/100</span>
                </div>
            </div>
        </section>
        <section class="forecast-section" id="forecastSection">
            <h3>3-Days Forecast</h3>
            <div id="forecast-grid" class="forecast-grid"></div>
        </section>
        <section class="recommendations">
            <h3>Recommended Activities</h3>
            <div id="activity-list" class="activity-grid"></div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
